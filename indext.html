<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<style>
body {
    margin: 0;
    padding: 0;
    background: rgb(255, 255, 255);
    overflow: hidden;
    font-family: Arial, sans-serif;
}

/* Corazón */
/* Corazón reducido un 30% */
.heart {
    position: absolute;
    width: 18px;   /* antes 25px */
    height: 18px;  /* antes 25px */
    background-color: red;
    transform: rotate(45deg);
    z-index: 1; 
}

.heart::before,
.heart::after {
    content: "";
    position: absolute;
    width: 18px;
    height: 18px;
    background-color: red;
    border-radius: 50%;
}

.heart::before { top: -9px; left: 0; }  /* mitad de 18px */
.heart::after  { left: -9px; top: 0; }  /* mitad de 18px */

.heart::before {
    top: -12.px;
    left: 0;
}

.heart::after {
    left: -12.px;
    top: 0;
}

/* Div de texto central */
.text-box {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 250px;
    height: 300px;
    padding: 20px;
    background-color: rgb(255, 255, 255);
    text-align: center;
    font-size: 24px;
    color: black;
    border-radius: 10px;
    box-shadow: 0 4px 15px 20px rgba(99, 99, 99, 0.2);
    z-index: 2;
    transition: transform 0.3s, box-shadow 0.3s;
    border: px solid black;
}

.text-box:hover {
    transform: translate(-50%, -50%) scale(1.1);
    box-shadow: 0px 8px 30px 15px rgba(246, 0, 0, 0.8);
}

.photo {
    width: 150px;          
    height: 150px;         
    border-radius: 50%;    
    object-fit: cover;     
    display: block;
    margin: 0 auto;        
}

.custom-button{
    text-decoration: none;
    color: black;
    text-align: center;
    font-family: Arial, Helvetica, sans-serif;
}
</style>
</head>
<body>

<a href="https://www.instagram.com/bv_jaan/" class="custom-button" target="_blank">
    <div class="text-box">
        <p><b>MI INSTAGRAM</b></p>
        <img src="foto1.jpeg" alt="Foto" class="photo"> <br>
        <b>@bv_jaan</b>
    </div>
</a>

<script>
// Tamaño del corazón y espacio extra entre ellos
const heartSize = 60; // Aumenta este valor para más separación
const heartWidth = 25; // ancho del corazón
const heartHeight = 25; // alto del corazón

// Función para generar corazones en toda la pantalla
function generateHearts() {
    // Limpiar corazones antiguos
    document.querySelectorAll(".heart").forEach(h => h.remove());

    const rows = Math.ceil(window.innerHeight / heartSize);
    const cols = Math.ceil(window.innerWidth / heartSize);

    for(let r = 0; r < rows; r++){
        for(let c = 0; c < cols; c++){
            const heart = document.createElement("div");
            heart.classList.add("heart");
            heart.style.top = r * heartSize + "px";
            heart.style.left = c * heartSize + "px";
            document.body.appendChild(heart);
        }
    }
}

// Inicial
generateHearts();

// Re-generar al cambiar el tamaño de ventana
window.addEventListener("resize", generateHearts);
</script>

</body>
</html>
